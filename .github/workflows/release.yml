name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          global-json-file: global.json

      - name: Resolve version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionOutput = & dotnet msbuild .\src\Ncm.App\Ncm.App.csproj '-getProperty:Version' '-p:Configuration=Release' '-p:Platform=x64' -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the application version.' }
          $version = (@($versionOutput) -join '').Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Expected a three-part release version, received: $version"
          }
          foreach ($part in $version.Split('.')) {
            $number = 0
            if (-not [int]::TryParse($part, [ref]$number) -or $number -gt 65535) {
              throw "Version components must be between 0 and 65535: $version"
            }
          }
          $tag = "v$version"
          $releaseTags = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases.' }
          if ($releaseTags -contains $tag) { throw "Release $tag already exists; increment the project version." }
          $tagRefs = @(& git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
          if ($tagRefs.Count -gt 0) {
            $peeled = @($tagRefs | Where-Object { $_.EndsWith("refs/tags/$tag^{}") })
            $tagCommit = if ($peeled.Count -gt 0) { ($peeled[0] -split '\s+')[0] } else { ($tagRefs[0] -split '\s+')[0] }
            if ($tagCommit -ne $env:GITHUB_SHA) { throw "Tag $tag belongs to a different commit." }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare release notes
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:APP_VERSION"
          $setupFileName = "NcmConverter-$env:APP_VERSION-win-x64-setup.exe"
          $changesPath = "docs/releases/$env:APP_VERSION.md"
          if (-not (Test-Path -LiteralPath $changesPath -PathType Leaf)) {
            throw "Write the release changes in $changesPath before publishing."
          }
          $changes = Get-Content -LiteralPath $changesPath -Raw -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($changes)) { throw "Release changes are empty: $changesPath" }
          $changes = $changes.Trim()
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $notes = @(
            '将 NCM 音乐文件转换为 MP3 或 FLAC，保留歌曲信息和封面。',
            '',
            '## 本次更新',
            '',
            $changes,
            '',
            '## 下载与安装',
            '',
            "- [下载 Windows x64 安装包 $env:APP_VERSION]($downloadUrl/$setupFileName)",
            '- 支持 Windows 10 1809（内部版本 17763）及以上的 x64 Windows，包括 Windows 11。',
            '- 离线安装，无需预先安装 .NET 或 Windows App SDK 运行库；默认仅为当前用户安装，无需管理员权限。',
            '- 升级时直接运行新版本安装包，沿用原安装目录。',
            '',
            '## 附件说明',
            '',
            '- **安装包（.exe）**：普通用户下载此文件即可。',
            '- **校验文件（.sha256）**：对应附件的 SHA-256 校验值。',
            "- [third-party-sources.zip]($downloadUrl/third-party-sources.zip)：第三方组件的对应源码。",
            '- **Source code**：项目源码与构建脚本，使用软件无需下载。',
            '',
            "[第三方许可与声明](https://github.com/$env:GITHUB_REPOSITORY/blob/$tag/licenses/README.md) · [反馈问题](https://github.com/$env:GITHUB_REPOSITORY/issues)"
          ) -join [Environment]::NewLine
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))

      - name: Check release workflow
        run: .\tools\Test-ReleaseWorkflow.ps1

      - name: Restore and test
        run: |
          dotnet restore .\Ncm.sln -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Dependency restore failed.' }
          dotnet test .\Ncm.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Module tests failed.' }

      - name: Set up native build tools
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja

      - name: Set up Inno Setup
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') {
            throw 'Inno Setup installer SHA-256 mismatch.'
          }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-7.1.0'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerRoot`"")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $compilerRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'ISCC.exe was not installed.' }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release assets
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          .\tools\Build-NativeMedia.ps1 -Msys2Root $env:MSYS2_ROOT
          .\tools\Build-Installer.ps1 -Version $env:APP_VERSION -IsccPath $env:INNO_COMPILER
          .\tools\Build-SourceArchive.ps1

      - name: Publish GitHub Release
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $installerPath = "artifacts/installer/NcmConverter-$env:APP_VERSION-win-x64-setup.exe"
          $sourceArchivePath = 'artifacts/release-sources/third-party-sources.zip'
          $assets = @($installerPath, "$installerPath.sha256", $sourceArchivePath, "$sourceArchivePath.sha256")
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -le 0) {
              throw "Release asset is missing or empty: $asset"
            }
          }
          foreach ($asset in @($installerPath, $sourceArchivePath)) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksum = (Get-Content -LiteralPath "$asset.sha256" -Raw -Encoding utf8).Trim()
            if ($checksum -ne "$hash *$(Split-Path -Leaf $asset)") { throw "Release checksum does not match: $asset" }
          }
          $tag = "v$env:APP_VERSION"
          $releaseTags = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not recheck existing releases.' }
          if ($releaseTags -contains $tag) { throw "Release $tag already exists; refusing to overwrite it." }
          $tagRefs = @(& git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not recheck the release tag.' }
          if ($tagRefs.Count -gt 0) {
            $peeled = @($tagRefs | Where-Object { $_.EndsWith("refs/tags/$tag^{}") })
            $tagCommit = if ($peeled.Count -gt 0) { ($peeled[0] -split '\s+')[0] } else { ($tagRefs[0] -split '\s+')[0] }
            if ($tagCommit -ne $env:GITHUB_SHA) { throw "Tag $tag belongs to a different commit." }
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw 'Prepared release notes are missing.' }
          & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "NCM 转换器 $env:APP_VERSION" --notes-file $notesPath --generate-notes --latest=true
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
